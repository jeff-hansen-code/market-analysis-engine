trigger:
  branches:
    include:
      - main

parameters:
  - name: env
    displayName: Terraform workspace
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: runDestroy
    displayName: RUN DESTROY (manual only)
    type: boolean
    default: false

  - name: confirmDestroy
    displayName: Confirm DESTROY (must be true)
    type: boolean
    default: false

variables:
  # ====== REQUIRED
  azureServiceConnection: 'Service_Conn_for_Sub1_ARM'
  keyVaultName: 'basekv'

  # Terraform
  tfDir: 'infra/terraform'
  tfVersion: '1.14.4'

  backendResourceGroup: 'BaseRG'
  backendStorageAccount: 'basetfsacenus'
  backendContainer: 'market-analysis-engine'
  backendKey: 'market-analysis-engine.tfstate'

  # ADO Environment name ( created it as "dev")
  adoEnvironmentName: 'dev'

  # Function project path 
  functionCsproj: 'backend/pipelines/MarketAnalysis.Functions/MarketAnalysis_Functions.csproj'

stages:
  - stage: Build
    displayName: Build Function App
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - script: |
              dotnet restore
              dotnet publish "$(functionCsproj)" -c Release -o "$(Build.ArtifactStagingDirectory)/publish"
            displayName: dotnet publish

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
              replaceExistingArchive: true
            displayName: Zip function output

          - publish: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
            artifact: functionapp

  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: Build
    jobs:
      - job: Plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(tfVersion)'

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: 'TFSTATE-STORAGE-KEY,ARM-SUBSCRIPTION-ID,ARM-TENANT-ID,ARM-CLIENT-ID,ARM-CLIENT-SECRET,SERVICE-PRINCIPAL-ID'
              RunAsPreJob: true

          - script: |
              set -e
              cd "$(tfDir)"

              terraform -version

              terraform init \
                -backend-config="resource_group_name=$(backendResourceGroup)" \
                -backend-config="storage_account_name=$(backendStorageAccount)" \
                -backend-config="container_name=$(backendContainer)" \
                -backend-config="key=$(backendKey)"

              terraform workspace select ${{ parameters.env }} || terraform workspace new ${{ parameters.env }}

              terraform workspace select ${{ parameters.env }}

              terraform fmt -check -recursive
              terraform validate

              terraform plan -out=tfplan
            displayName: terraform plan
            env:
              ARM_ACCESS_KEY: $(TFSTATE-STORAGE-KEY)
              ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
              ARM_TENANT_ID: $(ARM-TENANT-ID)
              ARM_CLIENT_ID: $(ARM-CLIENT-ID)
              ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
              TF_VAR_subscription_id: $(ARM-SUBSCRIPTION-ID)
              TF_VAR_pipeline_service_principal_object_id: $(SERVICE-PRINCIPAL-ID)

          - publish: '$(tfDir)/tfplan'
            artifact: tfplan

  - stage: TerraformApply
    displayName: Terraform Apply (Approved)
    dependsOn: TerraformPlan
    condition: succeeded() # and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: Apply Terraform
        environment: '$(adoEnvironmentName)'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '$(tfVersion)'

                - task: AzureKeyVault@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    KeyVaultName: '$(keyVaultName)'
                    SecretsFilter: 'TFSTATE-STORAGE-KEY,ARM-SUBSCRIPTION-ID,ARM-TENANT-ID,ARM-CLIENT-ID,ARM-CLIENT-SECRET,SERVICE-PRINCIPAL-ID'
                    RunAsPreJob: true

                - download: current
                  artifact: tfplan

                - script: |
                    set -e
                    cd "$(tfDir)"

                    terraform init \
                      -backend-config="resource_group_name=$(backendResourceGroup)" \
                      -backend-config="storage_account_name=$(backendStorageAccount)" \
                      -backend-config="container_name=$(backendContainer)" \
                      -backend-config="key=$(backendKey)"

                    terraform workspace select ${{ parameters.env }}

                    terraform apply -input=false -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
                  displayName: terraform apply
                  env:
                    ARM_ACCESS_KEY: $(TFSTATE-STORAGE-KEY)
                    ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
                    ARM_TENANT_ID: $(ARM-TENANT-ID)
                    ARM_CLIENT_ID: $(ARM-CLIENT-ID)
                    ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
                    TF_VAR_pipeline_service_principal_object_id: $(SERVICE-PRINCIPAL-ID)

  - stage: DeployFunction
    displayName: Deploy Function App
    dependsOn: TerraformApply
    condition: succeeded()
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: functionapp

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(tfVersion)'

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              KeyVaultName: '$(keyVaultName)'
              SecretsFilter: 'TFSTATE-STORAGE-KEY,ARM-SUBSCRIPTION-ID,ARM-TENANT-ID,ARM-CLIENT-ID,ARM-CLIENT-SECRET,SERVICE-PRINCIPAL-ID'
              RunAsPreJob: true

          - bash: |
              set -e
              cd "$(tfDir)"

              terraform init \
                -backend-config="resource_group_name=$(backendResourceGroup)" \
                -backend-config="storage_account_name=$(backendStorageAccount)" \
                -backend-config="container_name=$(backendContainer)" \
                -backend-config="key=$(backendKey)"

              terraform workspace select ${{ parameters.env }}

              APP_NAME="$(terraform output -raw function_app_name)"
              echo "##vso[task.setvariable variable=FUNCTION_APP_NAME]$APP_NAME"

              RG="$(terraform output -raw resource_group_name)"
              echo "##vso[task.setvariable variable=RESOURCE_GROUP_NAME]$RG"
              
              SA_NAME="$(terraform output -raw func_storage_account_name)"
              echo "##vso[task.setvariable variable=FUNC_STORAGE_ACCOUNT_NAME]$SA_NAME"

            displayName: Get function app name from TF output
            env:
              ARM_ACCESS_KEY: $(TFSTATE-STORAGE-KEY)
              ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
              ARM_TENANT_ID: $(ARM-TENANT-ID)
              ARM_CLIENT_ID: $(ARM-CLIENT-ID)
              ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
              TF_VAR_subscription_id: $(ARM-SUBSCRIPTION-ID)
              TF_VAR_pipeline_service_principal_object_id: $(SERVICE-PRINCIPAL-ID)

          - bash: |
              az login --service-principal \
                --username "$(ARM-CLIENT-ID)" \
                --password "$(ARM-CLIENT-SECRET)" \
                --tenant "$(ARM-TENANT-ID)" \
                --output none

              az account set --subscription "$(ARM-SUBSCRIPTION-ID)"

              PACKAGE_NAME="package_$(Build.BuildId).zip"
              STORAGE_ACCOUNT="$(terraform output -raw func_storage_account_name)"  
              CONTAINER="azure-pipelines-deploy"
              EXPIRY=$(date -u -d "+1 year" '+%Y-%m-%dT%H:%MZ')

              az storage blob upload \
                --account-name "$(FUNC_STORAGE_ACCOUNT_NAME)" \
                --container-name "$CONTAINER" \
                --name "$PACKAGE_NAME" \
                --file "$(Pipeline.Workspace)/functionapp/functionapp.zip" \
                --auth-mode login \
                --overwrite

              ACCOUNT_KEY=$(az storage account keys list \
                --account-name "$(FUNC_STORAGE_ACCOUNT_NAME)" \
                --resource-group "$(RESOURCE_GROUP_NAME)" \
                --query "[0].value" -o tsv)

              SAS_URL=$(az storage blob generate-sas \
                --account-name "$(FUNC_STORAGE_ACCOUNT_NAME)" \
                --container-name "$CONTAINER" \
                --name "$PACKAGE_NAME" \
                --permissions r \
                --expiry "$EXPIRY" \
                --account-key "$ACCOUNT_KEY" \
                --full-uri \
                --output tsv)

              az functionapp config appsettings set \
                --name "$(FUNCTION_APP_NAME)" \
                --resource-group "$(RESOURCE_GROUP_NAME)" \
                --settings "WEBSITE_RUN_FROM_PACKAGE=$SAS_URL"

              az functionapp restart \
                --name "$(FUNCTION_APP_NAME)" \
                --resource-group "$(RESOURCE_GROUP_NAME)"

              echo "Deployment complete."
            displayName: Deploy zip to blob and set WEBSITE_RUN_FROM_PACKAGE
            env:
              ARM_CLIENT_ID: $(ARM-CLIENT-ID)
              ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
              ARM_TENANT_ID: $(ARM-TENANT-ID)
              ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
              TF_VAR_pipeline_service_principal_object_id: $(SERVICE-PRINCIPAL-ID)

  - stage: Destroy
    displayName: Terraform Destroy (MANUAL ONLY)
    dependsOn: []
    condition: and(succeeded(), eq(${{ parameters.runDestroy }}, true), eq(${{ parameters.confirmDestroy }}, true))
    jobs:
      - deployment: Destroy
        displayName: Destroy Terraform
        environment: '$(adoEnvironmentName)'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '$(tfVersion)'

                - task: AzureKeyVault@2
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    KeyVaultName: '$(keyVaultName)'
                    SecretsFilter: 'TFSTATE-STORAGE-KEY,ARM-SUBSCRIPTION-ID,ARM-TENANT-ID,ARM-CLIENT-ID,ARM-CLIENT-SECRET,SERVICE-PRINCIPAL-ID'
                    RunAsPreJob: true

                - script: |
                    set -e
                    cd "$(tfDir)"

                    terraform init \
                      -backend-config="resource_group_name=$(backendResourceGroup)" \
                      -backend-config="storage_account_name=$(backendStorageAccount)" \
                      -backend-config="container_name=$(backendContainer)" \
                      -backend-config="key=$(backendKey)"

                    terraform workspace select ${{ parameters.env }}

                    terraform destroy -auto-approve
                  displayName: terraform destroy
                  env:
                    ARM_ACCESS_KEY: $(TFSTATE-STORAGE-KEY)
                    ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)
                    ARM_TENANT_ID: $(ARM-TENANT-ID)
                    ARM_CLIENT_ID: $(ARM-CLIENT-ID)
                    ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
                    TF_VAR_subscription_id: $(ARM-SUBSCRIPTION-ID)
                    TF_VAR_pipeline_service_principal_object_id: $(SERVICE-PRINCIPAL-ID)