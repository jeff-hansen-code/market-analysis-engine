trigger:
  branches:
    include:
      - main

# =============================
# Runtime parameters
# =============================
parameters:
  - name: terraform_workspace
    displayName: Terraform workspace
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: RUN_DESTROY
    displayName: RUN DESTROY (manual only)
    type: boolean
    default: false

  - name: confirm_destroy
    displayName: Confirm DESTROY (must be true)
    type: boolean
    default: false

# =============================
# Variables
# =============================
variables:
  # IMPORTANT: set this to the exact name of your Azure DevOps Service Connection
  # (Project Settings → Service connections)
  azureServiceConnection: 'REPLACE_WITH_YOUR_SERVICE_CONNECTION_NAME'

  # Paths (adjust if your repo uses different folders)
  terraformFolder: 'infra/terraform'
  functionPublishFolder: 'publish'
  functionArtifactName: 'drop'
  functionZipName: 'functionapp.zip'

  # Function app name (adjust if you deploy different per workspace)
  functionAppName: 'maedevfunccus1'

stages:

# =============================
# BUILD FUNCTION APP
# =============================
- stage: Build_Function_App
  displayName: Build Function App
  condition: ne('${{ parameters.RUN_DESTROY }}', true)
  jobs:
    - job: Build
      displayName: Build
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: Use .NET SDK 8
          inputs:
            packageType: sdk
            version: '8.x'

        - script: |
            set -e
            dotnet --info
            dotnet restore
            dotnet publish -c Release -o "$(functionPublishFolder)"
          displayName: dotnet publish

        - task: ArchiveFiles@2
          displayName: Zip publish output
          inputs:
            rootFolderOrFile: '$(functionPublishFolder)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: '$(Build.ArtifactStagingDirectory)/$(functionZipName)'
            replaceExistingArchive: true

        - publish: '$(Build.ArtifactStagingDirectory)/$(functionZipName)'
          artifact: '$(functionArtifactName)'

# =============================
# TERRAFORM PLAN
# =============================
- stage: Terraform_Plan
  displayName: Terraform Plan
  dependsOn: Build_Function_App
  condition: ne('${{ parameters.RUN_DESTROY }}', true)
  jobs:
    - job: Plan
      displayName: Plan
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: Terraform init/plan
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformFolder)"
              terraform --version
              terraform init -reconfigure
              terraform workspace select "${{ parameters.terraform_workspace }}" || terraform workspace new "${{ parameters.terraform_workspace }}"
              terraform plan

# =============================
# TERRAFORM APPLY
# =============================
- stage: Terraform_Apply
  displayName: Terraform Apply
  dependsOn: Terraform_Plan
  condition: ne('${{ parameters.RUN_DESTROY }}', true)
  jobs:
    - job: Apply
      displayName: Apply
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: Terraform init/apply
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformFolder)"
              terraform --version
              terraform init -reconfigure
              terraform workspace select "${{ parameters.terraform_workspace }}"
              terraform apply -auto-approve

# =============================
# DEPLOY FUNCTION APP
# =============================
- stage: Deploy_Function_App
  displayName: Deploy Function App
  dependsOn: Terraform_Apply
  condition: ne('${{ parameters.RUN_DESTROY }}', true)
  jobs:
    - job: Deploy
      displayName: Deploy
      pool:
        vmImage: ubuntu-latest
      steps:
        - download: current
          artifact: '$(functionArtifactName)'

        - task: AzureFunctionApp@1
          displayName: Deploy ZIP to Function App (Linux)
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            appType: functionAppLinux
            appName: '$(functionAppName)'
            package: '$(Pipeline.Workspace)/$(functionArtifactName)/$(functionZipName)'

# =============================
# TERRAFORM DESTROY (MANUAL ONLY)
# =============================
- stage: Terraform_Destroy
  displayName: Terraform Destroy (MANUAL ONLY)
  condition: and(eq('${{ parameters.RUN_DESTROY }}', true), eq('${{ parameters.confirm_destroy }}', true))
  jobs:
    - job: Destroy
      displayName: Destroy
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self

        # IMPORTANT FIX: runs Terraform inside AzureCLI@2 using the service connection,
        # so Terraform gets proper ARM auth and does NOT rely on any $(arm-tenant-id) placeholders.
        - task: AzureCLI@2
          displayName: Terraform init/destroy
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e
              cd "$(terraformFolder)"
              terraform --version
              terraform init -reconfigure
              terraform workspace select "${{ parameters.terraform_workspace }}"
              terraform destroy -auto-approve
